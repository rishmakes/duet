[package]
name = "duet-app"
version = "0.11.0"
description = "An opinionated design tool, built by designers, for designers. You and your AI work hand in hand on one canvas."
authors = ["Sourish Mazumdar"]
license = "PolyForm-Shield-1.0.0"
repository = "https://github.com/rishmakes/duet"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "duet_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.1"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
tiny_http = "0.12.0"
uuid = { version = "1.27.0", features = ["v4"] }
base64 = "0.23.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
fontdb = "0.24.0"
# Photoshop files: reads and writes PSD and PSB, keeping what it does not understand untouched. MIT, from PhotoCraft.
photocraft-psd = { git = "https://github.com/storytold/photocraft", rev = "7ac7b8b106acccf6826d45ed5c9e481dfe341035" }
png = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Only to give development builds their own Dock icon. Tauri already brings these in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError"] }
# a picture of Duet's own window, taken from inside, so it works in the background
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"
