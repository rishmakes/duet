name: Release

# Push a tag like v0.1.0 to build installers for Mac and Windows.
# The release is created as a draft, so nothing is public until you publish it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          # 22.04 so the app runs on older Linux systems too; ffmpeg comes from the system on Linux
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Linux build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # the ffmpeg that ships inside Duet, pinned and checked, for the computer type being built
      - run: bash scripts/fetch-ffmpeg ${{ matrix.rust-targets || 'x86_64-pc-windows-msvc' }}
        if: matrix.platform != 'ubuntu-22.04'
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "-" signs the Mac app ad hoc, which Apple Silicon needs in order to run it at all.
          # It is not a paid certificate, so people still see the first-launch warning.
          APPLE_SIGNING_IDENTITY: "-"
          # Duet's own update key (free, not Apple's or Microsoft's): installed copies only accept updates signed with it
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Duet ${{ github.ref_name }}
          releaseBody: |
            Early release. Read the install guide first: https://github.com/rishmakes/duet/blob/main/docs/install.md

            This app is not signed with a paid certificate, so Mac and Windows will ask you to confirm the first time you open it. The guide shows exactly how.

            This is early access: some things are unfinished and you may meet bugs. Save versions of work that matters.

            The AI chat works with Claude Code and the Antigravity CLI. Video and motion are experimental and have mostly been tried on a Mac. On Mac and Windows Duet carries its own ffmpeg (LGPL), so nothing extra needs installing; on Linux the system's ffmpeg is installed with the app. Windows and Linux builds are less tested than Mac.
          releaseDraft: true
          # not a pre-release, so installed copies find it as the latest version and offer it
          prerelease: false
          args: ${{ matrix.args }}
