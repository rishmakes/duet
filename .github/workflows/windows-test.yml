name: Windows test build

# A Windows installer to try on the creator's own test PC. No tag, no release: nobody else gets it.
# Started by scripts/windows-test, which downloads it and installs it on that PC.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # a fresh saved build: the one from before Vulkan holds an old compiler path (#440)
          prefix-key: cpu1
      - run: npm ci
      - run: bash scripts/fetch-ffmpeg x86_64-pc-windows-msvc
        shell: bash
      # The speech engine is built for the common PC, not for the machine that builds it: built "native" on a
      # GitHub machine with AVX512, it crashed with "illegal instruction" on PCs without it (#440).
      # The old build is cleared, because Cargo does not notice these settings changing.
      - name: Speech engine for every PC
        shell: bash
        run: |
          {
            echo "GGML_NATIVE=OFF"
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
            echo "GGML_BMI2=ON"
            echo "GGML_AVX512=OFF"
          } >> "$GITHUB_ENV"
          cargo clean -p whisper-rs-sys --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - uses: actions/upload-artifact@v4
        with:
          name: duet-windows-test
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 3
